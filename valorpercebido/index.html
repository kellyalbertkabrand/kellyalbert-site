    P10:{o:'A sua imagem diminui o valor do que você entrega.', t:'O cliente conhece a sua empresa primeiro pelo Instagram, pelo site e pelos materiais. Se eles parecem menores do que a sua empresa é, ele chega esperando pouco e aceita pagar pouco.', a:'olhe o seu perfil como se fosse um cliente novo e anote tudo o que parece menor do que a sua empresa é. Comece a ajustar pelo que aparece primeiro.'},
    P11:{o:'O cliente ainda não confia o suficiente para pagar mais.', t:'Ele fica enquanto o preço está bom, mas ainda não tem motivos claros para ficar se o preço subir. Confiança se constrói com prova, e a prova precisa aparecer antes do preço.', a:'reúna 3 depoimentos ou resultados de clientes e mostre antes de falar de preço, na conversa, na proposta e no Instagram.'}
  };
  var ACAO_ENTREGA = {o:'A entrega ainda precisa de base.', t:'Antes de investir em comunicação, é preciso ter certeza do que sustenta a sua marca. Comunicar mais sem essa base aumenta a promessa, mas não aumenta a confiança do cliente.', a:'pergunte a 5 clientes "por que você continua comprando de mim?" e use as respostas para fortalecer a entrega e descobrir o seu diferencial.'};
  var ACAO_PROTEGER = {o:'Nenhum ponto crítico no que o cliente enxerga.', t:'O cliente reconhece o que você entrega. O risco agora é se acomodar: na crise, o concorrente vai tentar ocupar esse espaço.', a:'registre por escrito o que faz o cliente escolher você e garanta que toda a equipe fale a mesma coisa.'};

  var PERFIS = {
    valor_escondido:{nome:'Valor escondido', txt:'Você entrega muito, mas o cliente não enxerga. Na crise, é quem mais perde para o concorrente mais barato. A boa notícia: o valor já existe. Falta o cliente perceber.'},
    atravessa:{nome:'Marca que atravessa', txt:'O que você entrega é reconhecido pelo cliente. Essa é a marca que atravessa qualquer crise. Agora é proteger esse valor e crescer.'},
    promessa_maior:{nome:'Promessa maior que a entrega', txt:'A sua imagem está à frente da sua entrega. Cuidado: com o tempo, o cliente percebe. Fortaleça a entrega para sustentar o que a marca promete.'},
    base:{nome:'Base em construção', txt:'Antes de comunicar mais, é preciso fortalecer a entrega e definir o que torna você diferente.'}
  };

  // ─── ESTADO ─────────────────────────────────────────────────────
  var body = document.getElementById('rx-body');
  var footer = document.getElementById('rx-footer');
  var reduz = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var DIGITANDO = reduz ? 0 : 600;
  var estado = {passo:0, respostas:{}, concluido:false};
  var utm = lerUTM();

  function salvar(){ try{ localStorage.setItem(CONFIG.storageKey, JSON.stringify(estado)); }catch(e){} }
  function carregar(){ try{ return JSON.parse(localStorage.getItem(CONFIG.storageKey)||'null'); }catch(e){ return null; } }
  function limpar(){ try{ localStorage.removeItem(CONFIG.storageKey); }catch(e){} }

  function lerUTM(){
    var p = new URLSearchParams(location.search), o = {};
    ['utm_source','utm_medium','utm_campaign'].forEach(function(k){ if(p.get(k)) o[k]=p.get(k); });
    try{
      if(Object.keys(o).length) sessionStorage.setItem('ka_rx_utm', JSON.stringify(o));
      else o = JSON.parse(sessionStorage.getItem('ka_rx_utm')||'{}');
    }catch(e){}
    return o;
  }

  // Métricas: usa o pixel/gtag se existirem; sempre registra no console
  function evento(nome, dados){
    try{ if(window.fbq) window.fbq('trackCustom', 'RaioX_'+nome, dados||{}); }catch(e){}
    try{ if(window.gtag) window.gtag('event', 'raiox_'+nome, dados||{}); }catch(e){}
    if(window.console) console.log('[raio-x]', nome, dados||'');
  }

  function progresso(){
    var n = Object.keys(estado.respostas).length;
    document.getElementById('rx-prog-txt').textContent = Math.min(n,PERGUNTAS.length)+' de '+PERGUNTAS.length;
    document.getElementById('rx-prog').style.width = (Math.min(n,10)*10)+'%';
  }

  // ─── MENSAGENS ─────────────────────────────────────────────────
  function rolar(el){ setTimeout(function(){ (el||footer).scrollIntoView({behavior: reduz?'auto':'smooth', block:'end'}); }, 40); }

  function bot(texto, cb, html){
    var d = document.createElement('div'); d.className='digitando'; d.innerHTML='<span></span><span></span><span></span>';
    body.appendChild(d); rolar(d);
    setTimeout(function(){
      d.remove();
      var b = document.createElement('div'); b.className='bolha bolha--bot';
      if(html) b.innerHTML = texto; else b.textContent = texto;
      body.appendChild(b); rolar(b);
      if(cb) cb();
    }, DIGITANDO);
  }
  function bots(lista, cb){
    var i = 0;
    (function prox(){ if(i>=lista.length){ if(cb) cb(); return; } bot(lista[i++], prox); })();
  }
  function usuario(texto){ var b=document.createElement('div'); b.className='bolha bolha--user'; b.textContent=texto; body.appendChild(b); rolar(b); }
  function marcaBloco(num, titulo, sub){
    var b=document.createElement('div'); b.className='bloco-marca'; b.setAttribute('role','heading'); b.setAttribute('aria-level','2');
    b.innerHTML='<small>Bloco '+num+' de 2</small><strong>'+titulo+'</strong><span>'+sub+'</span>';
    body.appendChild(b);
  }

  function botoes(lista){
    footer.innerHTML='';
    lista.forEach(function(item){
      var bt=document.createElement('button'); bt.type='button'; bt.className=item.classe||'opcao'; bt.textContent=item.t;
      bt.addEventListener('click', function(){ item.f(bt); });
      footer.appendChild(bt);
    });
    var primeiro = footer.querySelector('button'); if(primeiro && !reduz) primeiro.focus({preventScroll:true});
    rolar();
  }

  // ─── FLUXO ─────────────────────────────────────────────────────
  function iniciar(){
    var salvo = carregar();
    if(salvo && !salvo.concluido && Object.keys(salvo.respostas||{}).length){
      estado = salvo; progresso();
      bot(TEXTOS.retomar, function(){
        botoes([
          {t:'Continuar de onde parei', classe:'btn btn--laranja', f:function(){ footer.innerHTML=''; usuario('Continuar de onde parei'); evento('retomou',{passo:estado.passo}); perguntar(); }},
          {t:'Começar de novo', classe:'btn btn--contorno', f:function(){ footer.innerHTML=''; usuario('Começar de novo'); estado={passo:0,respostas:{},concluido:false}; salvar(); progresso(); perguntar(); }}
        ]);
      });
      return;
    }
    bots(TEXTOS.abertura, function(){
      botoes([{t:'Começar', classe:'btn btn--laranja', f:function(){ footer.innerHTML=''; usuario('Começar'); evento('inicio'); perguntar(); }}]);
    });
  }

  function perguntar(){
    if(estado.passo >= PERGUNTAS.length){ capturar(); return; }
    var q = PERGUNTAS[estado.passo];
    var antes = function(cb){ cb(); };
    if(q.id===BLOCO1[0].id){ antes = function(cb){ marcaBloco(1, 'Valor real', 'O que a sua empresa entrega'); cb(); }; }
    if(q.id===BLOCO2[0].id){ antes = function(cb){ evento('bloco1_concluido'); marcaBloco(2, 'Valor percebido', 'O que o cliente enxerga'); cb(); }; }
    antes(function(){
      bot(q.q, function(){
        botoes(q.r.map(function(texto, i){
          return {t:texto, f:function(bt){
            bt.classList.add('escolhida');
            estado.respostas[q.id] = {i:i, pontos:PONTOS[i], resposta:texto};
            estado.passo++; salvar(); progresso();
            setTimeout(function(){ footer.innerHTML=''; usuario(texto); perguntar(); }, reduz?0:160);
          }};
        }));
      });
    });
  }

  function capturar(){
    evento('bloco2_concluido');
    var salvo = {}; try{ salvo = JSON.parse(localStorage.getItem(CONFIG.leadKey)||'{}'); }catch(e){}
    function v(k){ return (salvo[k]||'').replace(/"/g,'&quot;'); }
    bot(TEXTOS.captura, function(){
      footer.innerHTML =
        '<form class="form" id="rx-form" novalidate>'+
          '<div class="campo"><label for="rx-nome">Nome <small>*</small></label><input id="rx-nome" name="nome" type="text" autocomplete="name" placeholder="Nome e sobrenome" value="'+v('nome')+'" required></div>'+
          '<div class="campo"><label for="rx-email">E-mail <small>*</small></label><input id="rx-email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="seu@email.com" value="'+v('email')+'" required></div>'+
          '<div class="campo"><label for="rx-wa">WhatsApp com DDD <small>*</small></label><input id="rx-wa" name="whatsapp" type="tel" autocomplete="tel" inputmode="numeric" placeholder="(00) 00000-0000" value="'+v('whatsapp')+'" required></div>'+
          '<div class="campo"><label for="rx-seg">Segmento <small>(opcional)</small></label><select id="rx-seg" name="segmento">'+
            '<option value="">Escolha o seu segmento</option>'+
            SEGMENTOS.map(function(x){ return '<option'+(salvo.segmento===x?' selected':'')+'>'+x+'</option>'; }).join('')+
          '</select></div>'+
          '<label class="consent"><input id="rx-consent" type="checkbox" name="consentimento" required> <span>Aceito receber o meu resultado e contato da KA por e-mail e WhatsApp.</span></label>'+
          '<p class="erro" id="rx-erro" role="alert"></p>'+
          '<button type="submit" class="btn btn--laranja">Ver o meu resultado</button>'+
          '<p class="dica">Seus dados ficam só com a KA. Sem spam.</p>'+
        '</form>';
      var wa = document.getElementById('rx-wa');
      wa.addEventListener('input', function(){ wa.value = mascara(wa.value); });
      document.getElementById('rx-form').addEventListener('submit', enviar);
      rolar();
      var n = document.getElementById('rx-nome'); if(!reduz) n.focus({preventScroll:true});
    });
  }

  function mascara(v){
    var d = v.replace(/\D/g,'').slice(0,11);
    if(d.length<=2) return d.length?'('+d:'';
    if(d.length<=6) return '('+d.slice(0,2)+') '+d.slice(2);
    if(d.length<=10) return '('+d.slice(0,2)+') '+d.slice(2,6)+'-'+d.slice(6);
    return '('+d.slice(0,2)+') '+d.slice(2,7)+'-'+d.slice(7);
  }
  function validaEmail(e){
    e=(e||'').trim().toLowerCase();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e)) return 'Digite um e-mail válido (ex.: nome@exemplo.com).';
    var dom=e.split('@')[1];
    var TYPO={'gmail.con':'gmail.com','gmial.com':'gmail.com','gnail.com':'gmail.com','hotmial.com':'hotmail.com','hotmail.con':'hotmail.com','outlok.com':'outlook.com','yahoo.con':'yahoo.com','icloud.con':'icloud.com'};
    if(TYPO[dom]) return 'Seu e-mail parece ter um erro. Você quis dizer "'+e.split('@')[0]+'@'+TYPO[dom]+'"?';
    return null;
  }

  function enviar(ev){
    ev.preventDefault();
    var f = ev.target, err = document.getElementById('rx-erro');
    function falha(msg){ err.textContent=msg; err.style.display='block'; }
    err.style.display='none';
    var nome = f.nome.value.trim().replace(/\s+/g,' ');
    var segmento = f.segmento.value;
    var email = f.email.value.trim();
    var whatsapp = f.whatsapp.value.trim();
    if(nome.split(' ').filter(function(p){return p.length>=2;}).length<2) return falha('Digite o seu nome e sobrenome.');
    var eE = validaEmail(email); if(eE) return falha(eE);
    var d = whatsapp.replace(/\D/g,''); if(d.length<10||d.length>11) return falha('Digite o WhatsApp com DDD, por exemplo (51) 99999-9999.');
    if(!f.consentimento.checked) return falha('Para ver o resultado, marque que aceita receber o contato da KA.');

    var lead = {nome:nome, segmento:segmento, email:email, whatsapp:whatsapp};
    try{ localStorage.setItem(CONFIG.leadKey, JSON.stringify(lead)); }catch(e){}
    var btn = f.querySelector('button'); btn.disabled=true; btn.textContent='Montando o seu resultado…';

    var r = calcular();
    enviarLead(lead, r);
    estado.concluido = true; salvar();
    evento('lead_enviado',{perfil:r.perfil});

    setTimeout(function(){ footer.innerHTML=''; usuario('Ver o meu resultado'); mostrarResultado(lead, r); }, 300);
  }

  // ─── CÁLCULO ───────────────────────────────────────────────────
  function soma(lista){ return lista.reduce(function(s,q){ return s+((estado.respostas[q.id]||{}).pontos||0); },0); }
  function calcular(){
    var entrega = Math.round(soma(BLOCO1)*10/BLOCO1.length), enxerga = Math.round(soma(BLOCO2)*10/BLOCO2.length), distancia = entrega-enxerga;
    var ea = entrega>=60, xa = enxerga>=60;
    var perfil = ea&&!xa ? 'valor_escondido' : ea&&xa ? 'atravessa' : !ea&&xa ? 'promessa_maior' : 'base';
    var piores = BLOCO2.map(function(q,ordem){ return {id:q.id, p:(estado.respostas[q.id]||{}).pontos||0, ordem:ordem}; })
      .filter(function(x){ return x.p<10; })
      .sort(function(a,b){ return a.p-b.p || a.ordem-b.ordem; }).slice(0,3).map(function(x){ return x.id; });
    var acoes = piores.map(function(id){ return ACOES[id]; });
    if(!acoes.length) acoes.push(ACAO_PROTEGER);
    if(perfil==='base'||perfil==='promessa_maior') acoes.push(ACAO_ENTREGA);
    return {entrega:entrega, enxerga:enxerga, distancia:distancia, perfil:perfil, piores:piores, acoes:acoes};
  }

  // ─── ENVIO DO LEAD ─────────────────────────────────────────────
  function enviarLead(lead, r){
    var respostas = PERGUNTAS.map(function(q){ var x=estado.respostas[q.id]||{}; return q.id+': '+(x.resposta||'')+' ('+(x.pontos||0)+')'; }).join(' | ');
    // 1) Netlify Forms (backup: sempre cai no painel do Netlify)
    try{
      var fd = new URLSearchParams();
      fd.append('form-name','raio-x-marca');
      fd.append('nome',lead.nome); fd.append('segmento',lead.segmento||''); fd.append('email',lead.email); fd.append('whatsapp',lead.whatsapp);
      fd.append('consentimento','sim');
      fd.append('valor_real',r.entrega+'%'); fd.append('valor_percebido',r.enxerga+'%'); fd.append('distancia',String(r.distancia)); fd.append('perfil',PERFIS[r.perfil].nome);
      fd.append('respostas',respostas); fd.append('origem',CONFIG.origem);
      fd.append('utm_source',utm.utm_source||''); fd.append('utm_medium',utm.utm_medium||''); fd.append('utm_campaign',utm.utm_campaign||'');
      fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:fd.toString()}).catch(function(e){ console.warn('[Netlify Forms]',e); });
    }catch(e){}
    // 2) MailerLite (Netlify Function existente)
    try{
      fetch('/.netlify/functions/subscribe',{
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({nome:lead.nome, email:lead.email, whatsapp:lead.whatsapp, origem:CONFIG.origem, groupId:CONFIG.mailerliteGroupId})
      }).then(function(res){ if(!res.ok) console.warn('[MailerLite] HTTP', res.status); }).catch(function(e){ console.warn('[MailerLite]',e); });
    }catch(e){}
  }

  // ─── RESULTADO ─────────────────────────────────────────────────
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function mostrarResultado(lead, r){
    var primeiro = esc(lead.nome.split(' ')[0]);
    var p = PERFIS[r.perfil];
    var frase = r.distancia>0
      ? '<b>Distância: '+r.distancia+' pontos.</b> É o valor que você entrega e o seu cliente ainda não percebe.'
      : 'O valor percebido está à altura do valor real da sua marca.';
    var convite = r.distancia>0
      ? 'O valor real da sua marca é <b>'+r.entrega+'%</b>, mas o valor percebido pelo cliente é <b>'+r.enxerga+'%</b>. Essa distância é o que faz você ser escolhido pelo preço.'
      : 'O valor real da sua marca é <b>'+r.entrega+'%</b> e o valor percebido é <b>'+r.enxerga+'%</b>. O próximo passo é proteger esse valor e crescer.';
    var tituloPontos = r.perfil==='atravessa' ? 'Onde a sua marca ainda pode crescer' : 'Onde a sua marca está perdendo';
    var waKelly = 'https://wa.me/'+CONFIG.whatsapp+'?text='+encodeURIComponent('Oi, Kelly! Fiz o teste da minha marca e quero saber mais sobre a aula ao vivo do dia 14/11.');

    var wrap = document.createElement('div'); wrap.className='res';
    wrap.innerHTML =
      '<div class="res-cab"><small>Resultado do teste</small><strong>Valor real e valor percebido</strong></div>'+
      '<article class="laudo" aria-label="O seu resultado">'+
        '<section class="laudo__sec">'+
          '<p class="eyebrow">O que sua marca entrega × O que seu cliente enxerga</p>'+
          '<p class="laudo__nome">'+primeiro+', este é o retrato da sua marca hoje.</p>'+
          '<div class="notas">'+
            '<div class="nota"><div class="nota__topo"><span class="nota__rot">Valor real<small>o que você entrega</small></span><span class="nota__num">'+r.entrega+'%</span></div><div class="barra__trilho"><div class="barra__fill barra__fill--entrega" data-w="'+r.entrega+'"></div></div></div>'+
            '<div class="nota"><div class="nota__topo"><span class="nota__rot">Valor percebido<small>o que o cliente enxerga</small></span><span class="nota__num">'+r.enxerga+'%</span></div><div class="barra__trilho"><div class="barra__fill barra__fill--enxerga" data-w="'+r.enxerga+'"></div></div></div>'+
          '</div>'+
          '<p class="distancia">'+frase+'</p>'+
        '</section>'+
        '<section class="laudo__sec"><p class="eyebrow">O seu perfil</p><h3 class="perfil__nome">'+p.nome+'</h3><p>'+p.txt+'</p></section>'+
        '<section class="laudo__sec"><p class="eyebrow">'+tituloPontos+'</p>'+
          '<ol class="pontos">'+r.acoes.map(function(a){ return '<li><b>'+a.o+'</b> '+a.t+' <b>Primeira ação:</b> '+a.a+'</li>'; }).join('')+'</ol>'+
        '</section>'+
      '</article>'+
      '<div class="convite">'+
        '<p class="eyebrow">Aula ao vivo · vagas limitadas</p>'+
        '<h3 class="convite__tit">Descubra exatamente onde está a distância da sua marca</h3>'+
        '<p>'+convite+'</p>'+
        '<p>No <b>sábado, 14/11, das 9h às 12h</b>, eu faço uma <b>aula ao vivo com a ferramenta Diagnóstico da Marca</b>. Você aplica o diagnóstico na sua empresa, recebe as minhas orientações na hora e sai sabendo o que ajustar para o cliente enxergar o seu valor. As vagas são limitadas, para que eu converse com cada participante.</p>'+
        '<ul class="aula-info">'+
          '<li><span>Quando</span><b>'+CONFIG.aulaData+'</b></li>'+
          '<li><span>Horário</span><b>'+CONFIG.aulaHorario+'</b></li>'+
          '<li><span>Investimento</span><b>'+CONFIG.precoAula+'</b></li>'+
          '<li><span>Leve</span><b>Computador ou celular</b></li>'+
        '</ul>'+
        '<p>Tem interesse? Toque no botão abaixo e entre no grupo da aula no WhatsApp. Lá você recebe todas as informações.</p>'+
        '<a class="btn btn--laranja" id="rx-aula" href="'+CONFIG.linkGrupo+'" target="_blank" rel="noopener">Quero participar da aula</a>'+
        '<a class="btn btn--whats" href="'+waKelly+'" target="_blank" rel="noopener">Falar com a Kelly no WhatsApp</a>'+
        '<button type="button" class="btn btn--contorno" id="rx-copiar">Copiar o meu resultado</button>'+
        '<p class="copiado" id="rx-copiado" aria-live="polite"></p>'+
      '</div>'+
      '<div class="links">'+
        '<a href="'+CONFIG.instagram+'" target="_blank" rel="noopener">Acompanhe as lives no Instagram: <b>@kellyalbert.brand</b></a>'+
        '<a href="#" id="rx-refazer">Refazer o teste</a>'+
      '</div>';
    body.appendChild(wrap);
    document.getElementById('rx-prog-txt').textContent='Pronto';

    setTimeout(function(){ wrap.querySelectorAll('.barra__fill').forEach(function(el){ el.style.width = el.getAttribute('data-w')+'%'; }); }, reduz?0:250);
    setTimeout(function(){ wrap.scrollIntoView({behavior: reduz?'auto':'smooth', block:'start'}); }, 60);

    document.getElementById('rx-aula').addEventListener('click', function(){ evento('clique_aula',{perfil:r.perfil}); });
    document.getElementById('rx-copiar').addEventListener('click', function(){
      var txt = 'Teste: O que sua marca entrega × O que seu cliente enxerga\nKA | Inteligência para Marcas\n\n'+
        'Valor real (o que eu entrego): '+r.entrega+'%\n'+
        'Valor percebido (o que o cliente enxerga): '+r.enxerga+'%\n'+
        (r.distancia>0 ? 'Distância: '+r.distancia+' pontos\n' : '')+
        '\nPerfil: '+p.nome+'\n'+p.txt+'\n\n'+
        tituloPontos+':\n\n'+
        r.acoes.map(function(a,i){ return (i+1)+'. '+a.o+' '+a.t+' Primeira ação: '+a.a; }).join('\n\n')+
        '\n\nFaça o seu: https://kellyalbert.com.br/valorpercebido';
      var ok = function(){ document.getElementById('rx-copiado').textContent='Resultado copiado, com as notas e os pontos.'; };
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(ok, function(){ prompt('Copie o seu resultado:', txt); }); }
      else { prompt('Copie o seu resultado:', txt); }
      evento('copiou_resultado');
    });
    document.getElementById('rx-refazer').addEventListener('click', function(e){
      e.preventDefault(); limpar(); location.reload();
    });
  }

  document.addEventListener('DOMContentLoaded', iniciar);
})();
</script>
