# Teste de Autoavaliação de Marca: as regras são carregadas como módulo pela página.
[[headers]]
  for = "/valorpercebido/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "public, max-age=300"

# Autoavaliação de Marca (ferramenta da aula): regras carregadas como módulo pela página.
[[headers]]
  for = "/autoavaliacao/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "public, max-age=300"
