name: Ver resultado de uma autoavaliação
on:
  workflow_dispatch:
    inputs:
      id:
        description: Identificador do resultado
        required: true
jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - run: curl -sS "https://kellyalbert.com.br/api/autoavaliacao/resultado?id=${{ inputs.id }}" | python3 -m json.tool --no-ensure-ascii
